<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>优垦1385大肥方案 · 首图</title>
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/pkg.css">
</head>
<body>

<div class="card pkg v-hot">

  <div class="pkg-hd">
    <img class="lg-i" src="../assets/汇聚兴农Logo-背景透明-白色图标.png" alt="">
    <img class="lg-w" src="../assets/汇聚兴农Logo-文字-背景透明-文字白色.png" alt="汇聚兴农">
    <span class="cap">大肥方案</span>
  </div>

  <div class="pkg-main">
    <div class="pkg-name">优垦<span class="no">1385</span>大肥方案</div>
    <div class="pkg-sub">全生育期营养 · 一套到位</div>

    <div class="pkg-grid g4">
      <div class="pkg-item">
        <img class="pic" src="../assets/优垦-17-17-17.png" alt="优垦进口复合肥">
        <div class="nm">优垦进口复合肥</div>
        <div class="qty">×6袋</div>
      </div>
      <div class="pkg-item">
        <img class="pic" src="../assets/汇聚兴农中量元素钙镁肥-正面.png" alt="汇聚兴农中量元素钙镁肥">

      </div>
      <div class="pkg-item">
        <img class="pic" src="../assets/保亿农15-10-25.png" alt="保亿农复合肥15-10-25">
        <div class="nm">保亿农复合肥15-10-25</div>
        <div class="qty">×1袋</div>
      </div>
      <div class="pkg-item gift">
        <img class="pic" src="../assets/丸壮.png" alt="丸壮">
        <div class="nm">丸壮</div>
        <div class="qty">赠 1袋</div>
      </div>
    </div>
  </div>

  <div class="pkg-price">
    <span class="now"><span class="u">￥</span>1385</span>
    <span class="bonus">赠 丸壮 ×1袋</span>
  </div>

</div>

</body>
</html>
